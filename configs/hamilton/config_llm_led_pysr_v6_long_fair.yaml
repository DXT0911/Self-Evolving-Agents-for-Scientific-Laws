llm:
  deepseek:
    provider: "openai"
    model: "deepseek-v4-flash"
    api_key: "${HAMILTON_API_KEY}"
    base_url: "https://api.deepseek.com"
    temperature: 0.0
    max_tokens: 800
    timeout: 120
    max_retries: 2
    thinking: false
  default: "deepseek"

session:
  type: "local"
  local:
    timeout: 21600

experiment:
  min_rounds: 3
  max_rounds: 3
  evals_per_round: 4000
  max_total_evals: 12000
  early_stop_patience: 3
  max_total_tokens: 60000
  llm_decision_planner:
    enabled: true
    max_output_tokens: 800
  search_control:
    search_advancement: {min_score_improvement: 0.0}
    trust_region:
      enabled: true
      allow_noop_continue: true
      max_anchor_distance: 2
      max_step_changes: 1
      rollback_after_stale_rounds: 3
    dynamic_budget:
      enabled: true
      base_evals: 4000
      min_evals: 4000
      max_evals: 4000
      rounding_quantum: 500
    deterministic_policy:
      enabled: true
      binding: false
      warm_compatible_fields: [search.parsimony]
      thresholds:
        min_score_improvement: 0.0001
        stale_rounds_before_intervention: 2
        high_complexity_fraction: 0.8
        low_complexity_fraction: 0.25
        material_residual_correlation: 0.3
        min_validation_nrmse_for_residual_intervention: 0.02
        parsimony_multiplier: 2.0
        min_parsimony: 1.0e-8
        max_parsimony: 1.0

project_root: "."
debug: false

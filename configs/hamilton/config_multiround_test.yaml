llm:
  openai:
    provider: "openai"
    model: "deepseek-v4-pro"
    api_key: "${HAMILTON_API_KEY}"
    base_url: "https://api.deepseek.com"
    temperature: 0.2
    max_tokens: 6000
    timeout: 120
    max_retries: 1
    retry_delay: 1.0

  default: "openai"

agents:
  hamilton:
    llm: "openai"
    max_turns: 16
    max_total_tokens: 100000
    enable_tools: true

    context:
      max_tokens: 12000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 3

    system_prompt_file: "prompts/hamilton_adaptive_system.txt"
    user_prompt_file: "prompts/hamilton_adaptive_user.txt"

    skills:
      - literature-grounding
      - pysr
      - run-sr-experiment
      - evo-protocol

    tools:
      builtin: ["str_replace_editor", "literature_search", "think", "finish"]

session:
  type: "local"

  local:
    working_dir: "./playground/hamilton/workspace"
    timeout: 1800
    blocked_read_extensions: [".csv", ".tsv", ".parquet", ".feather"]
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

experiment:
  start_round: 1
  max_rounds: 3
  pysr_preflight:
    enabled: true
    timeout_seconds: 180
  resume_completed_result: "history/round1/results/viv-u248-round1-001-fast.json"
  scientific_governance: true
  require_literature_grounding: true
  max_total_tokens: 300000
  max_tokens_per_round: 100000
  max_total_evals: 24000
  stall_rounds: 3
  promotion:
    max_tokens: 30000
    max_attempts: 2

llm_output:
  show_in_console: false
  log_to_file: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true

project_root: "."
debug: false

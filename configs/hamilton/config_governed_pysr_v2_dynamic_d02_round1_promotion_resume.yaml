llm:
  openai:
    provider: "openai"
    model: "deepseek-v4-pro"
    api_key: "${HAMILTON_API_KEY}"
    base_url: "https://api.deepseek.com"
    temperature: 0.2
    max_tokens: 30000
    timeout: 120
    max_retries: 3
    retry_delay: 1.0
  default: "openai"
agents:
  hamilton:
    llm: "openai"
    max_turns: 10
    max_total_tokens: 100000
    enable_tools: true
    context:
      max_tokens: 120000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 3
    system_prompt_file: "prompts/hamilton_promotion_resume_system.txt"
    user_prompt_file: "prompts/hamilton_adaptive_user.txt"
    skills: []
    tools:
      builtin: [str_replace_editor, think, finish]
session:
  type: "local"
  local:
    working_dir: "./playground/hamilton/workspace"
    timeout: 1800
    blocked_read_extensions: [.csv, .tsv, .parquet, .feather]
    gpu_devices: null
    cpu_devices: null
    symlinks: {}
experiment:
  start_round: 1
  max_rounds: 1
  scientific_governance: true
  require_literature_grounding: false
  resume_completed_result: "history/round1/results/result.json"
  max_total_tokens: 100000
  max_tokens_per_round: 100000
  max_total_evals: 12000
  promotion:
    max_tokens: 100000
    max_attempts: 4
llm_output: {show_in_console: true, log_to_file: true}
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true
project_root: "."
debug: false

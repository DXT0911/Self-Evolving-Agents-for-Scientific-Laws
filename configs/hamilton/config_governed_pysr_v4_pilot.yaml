llm:
  openai:
    provider: "openai"
    model: "deepseek-v4-pro"
    api_key: "${HAMILTON_API_KEY}"
    base_url: "https://api.deepseek.com"
    temperature: 0.2
    max_tokens: 3000
    timeout: 120
    max_retries: 2
    retry_delay: 1.0
  default: "openai"

agents:
  hamilton:
    llm: "openai"
    max_turns: 8
    enable_tools: true
    context:
      max_tokens: 30000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 4
    system_prompt_file: "prompts/hamilton_v4_pilot_system.txt"
    user_prompt_file: "prompts/hamilton_adaptive_user.txt"
    skills: [run-sr-experiment]
    tools:
      builtin: [str_replace_editor, think, finish]

session:
  type: "local"
  local:
    working_dir: "./playground/hamilton/workspace"
    timeout: 21600
    blocked_read_extensions: [.csv, .tsv, .parquet, .feather]
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

experiment:
  max_rounds: 3
  max_total_tokens: 30000
  max_tokens_per_round: 5000
  task_template: "experiments/hamilton_vs_pysr_governed_search/templates/hamilton_task.md"
  scientific_governance: true
  require_literature_grounding: false
  max_total_evals: 4000
  search_control:
    search_advancement: {min_score_improvement: 0.0}
    trust_region:
      enabled: true
      allow_noop_continue: true
      max_anchor_distance: 2
      max_step_changes: 1
      rollback_after_stale_rounds: 2
    dynamic_budget:
      enabled: true
      base_evals: 1000
      min_evals: 1000
      max_evals: 1000
      rounding_quantum: 1000
    deterministic_policy:
      enabled: true
      binding: true
      warm_compatible_fields: [search.parsimony]
      thresholds:
        min_score_improvement: 0.0001
        stale_rounds_before_intervention: 2
        high_complexity_fraction: 0.8
        low_complexity_fraction: 0.25
        material_residual_correlation: 0.3
        parsimony_multiplier: 2.0
        min_parsimony: 1.0e-8
        max_parsimony: 1.0
  pysr_preflight: {enabled: true, timeout_seconds: 180}
  promotion:
    max_tokens: 5000
    max_attempts: 1

llm_output: {show_in_console: true, log_to_file: true}
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true
project_root: "."
debug: false

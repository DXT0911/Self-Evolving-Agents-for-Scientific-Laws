# Hamilton Playground 配置文件
# 通用符号回归 / ODE 发现 Agent

# ============================================
# LLM 配置
# ============================================
llm:
  openai:
    provider: "openai"
    model: "deepseek-v4-pro"
    api_key: "${HAMILTON_API_KEY}"
    base_url: "https://api.deepseek.com"
    temperature: 0.7
    max_tokens: 128000
    timeout: 120
    max_retries: 3
    retry_delay: 1.0

  default: "openai"

# ============================================
# Agent 配置（新版 per-agent 格式）
# ============================================
agents:
  hamilton:
    llm: "openai"
    max_turns: 120
    enable_tools: true

    context:
      max_tokens: 200000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 10

    system_prompt_file: "prompts/hamilton_system.txt"
    user_prompt_file: "prompts/hamilton_user.txt"

    # Per-agent skills（只加载需要的，不污染 prompt）
    skills:
      - literature-grounding
      - pysr
      - run-sr-experiment
      - evo-protocol

    # Per-agent tools
    # Keep raw-data access behind the approved experiment runner. In particular,
    # do not expose execute_bash to the LLM in the benchmark configuration.
    tools:
      builtin: ["str_replace_editor", "literature_search", "think", "finish"]

# ============================================
# Session 配置
# ============================================
session:
  type: "local"

  local:
    working_dir: "./playground/hamilton/workspace"
    timeout: 21600
    blocked_read_extensions: [".csv", ".tsv", ".parquet", ".feather"]
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

# ============================================
# 实验配置
# ============================================
experiment:
  max_rounds: 3
  scientific_governance: true
  require_literature_grounding: true
  max_total_evals: 36000
  search_control:
    search_advancement:
      min_score_improvement: 0.0
    trust_region:
      enabled: true
      max_anchor_distance: 2
      max_step_changes: 1
      rollback_after_stale_rounds: 2
    dynamic_budget:
      enabled: true
      base_evals: 12000
      min_evals: 4000
      max_evals: 20000
      rounding_quantum: 500
  pysr_preflight:
    enabled: true
    timeout_seconds: 180
  promotion:
    max_tokens: 30000
    max_attempts: 2

# ============================================
# LLM 输出 & 工具调用日志
# ============================================
llm_output:
  show_in_console: true
  log_to_file: true

# ============================================
# 日志配置
# ============================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true

# ============================================
# 项目配置
# ============================================
project_root: "."
debug: false

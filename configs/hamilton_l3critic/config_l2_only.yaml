llm:
  openai:
    provider: "openai"
    model: "gpt-5"
    api_key: "sk-1HEDl1RNtaMQV7TDet0FUA"
    base_url: "https://llm.dp.tech"
    temperature: 0.7
    max_tokens: 128000
    timeout: 120
    max_retries: 3
    retry_delay: 1.0
  default: "openai"

agents:
  hamilton:
    llm: "openai"
    max_turns: 120
    enable_tools: true
    context:
      max_tokens: 200000
      truncation_strategy: "latest_half"
      preserve_system_messages: true
      preserve_recent_turns: 10
    system_prompt_file: "prompts/hamilton_system.txt"
    user_prompt_file: "prompts/hamilton_user.txt"
    skills:
      - pysr
      - evo-protocol
    tools:
      builtin: ["*"]

session:
  type: "local"
  local:
    working_dir: "./playground/hamilton/workspace"
    timeout: 21600
    gpu_devices: null
    cpu_devices: null
    symlinks: {}

experiment:
  max_rounds: 3
  dual_agent_enabled: false
  critic_gate_enabled: false

memory:
  l3:
    enabled: false
    store_dir: "./runs/hamilton_shared_memory"
    bootstrap_top_k: 0
    critic_top_k: 0
    max_context_chars: 0
    promotion_policy: "disabled"
    merge_policy: "signature_v1"
    role_filtered: false

llm_output:
  show_in_console: true
  log_to_file: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true

project_root: "."
debug: false

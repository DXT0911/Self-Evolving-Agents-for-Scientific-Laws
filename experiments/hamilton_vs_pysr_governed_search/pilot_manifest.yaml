schema_version: 1
experiment_id: hamilton-vs-pysr-governed-search-pilot-v1
status: frozen
launch_blocked: false

research_question: >-
  Under matched public data, initial PySR search space, cumulative evaluations,
  deterministic candidate evaluation, and paired seeds, does governed Hamilton improve
  validation quality, repeatability, and evaluation efficiency over fixed PySR?

permissions:
  deepseek: true
  pysr_julia: true
  private_ood: false
  authorization_scope: operational_gate_only

comparison:
  primary:
    challenger: governed_hamilton
    baseline: ordinary_pysr
  diagnostic_baseline: fixed_schedule_pysr

arms:
  - id: ordinary_pysr
    llm_enabled: false
    schedule: single_continuous_search
    adaptive_search_config: false
  - id: fixed_schedule_pysr
    llm_enabled: false
    schedule: matched_episode_restarts
    adaptive_search_config: false
  - id: governed_hamilton
    llm_enabled: true
    schedule: matched_episode_restarts
    adaptive_search_config: true

fairness:
  locked_fields:
    - public_dataset_bytes
    - data_fingerprint
    - train_validation_split
    - feature_and_target_columns
    - initial_pysr_search_space
    - cumulative_pysr_evaluations
    - candidate_evaluator
    - scientific_gates
    - paired_seed_plan
    - code_and_environment
  episode_count: 3
  ordinary_search_uses_full_budget: true
  fixed_schedule_matches_hamilton_allowances: true
  llm_tokens_reported_separately: true

budget:
  authorization_state: authorized
  authorized_scope: operational_gate_only
  max_total_evals_per_task: 12000
  allocation_policy: hamilton_dynamic_then_paired_pysr_replay
  hamilton_dynamic_bounds:
    base_evals: 4000
    min_evals: 2000
    max_evals: 6000
    rounding_quantum: 500
  episode_evals: realized_from_paired_hamilton_ledger
  invariant: each_baseline_replays_paired_hamilton_actual_evaluations
  planned_totals:
    task_count: 11
    paired_repeats: 3
    arm_runs: 99
    pysr_search_episodes: 231
    maximum_evaluations_per_arm: 396000
    maximum_evaluations_all_arms: 1188000
    actual_evaluations: three_times_sum_of_paired_hamilton_ledgers

llm_budget:
  hamilton_task_repeats: 33
  max_turns_per_agent_phase: 20
  static_s01_repeat_1_final_recovery_token_ceiling: 26000
  discovery_max_tokens_per_round: 160000
  discovery_budget_revision:
    reason: dynamic_d01_round3_validated_config_execution
    prior_limit: 80000
    revised_limit: 160000
    changes_pysr_budget: false
  promotion_max_tokens_per_round: 160000
  promotion_budget_revision:
    reason: dynamic_d01_round2_deterministic_audit_repair
    prior_limit: 95000
    revised_limit: 160000
    changes_pysr_budget: false
  remaining_operational_task_max_total_tokens: 600000
  remaining_operational_task_promotion_max_attempts: 3
  invalid_pre_evaluation_tokens_already_consumed: 139005
  static_s01_repeat_1_tokens_consumed: 1047805
  dynamic_d01_repeat_1_tokens_consumed: 939099
  viv_u248_repeat_1_tokens_consumed: 625240
  operational_tokens_consumed: 2751149
  operational_unallocated_authorized_tokens: 848851
  operational_authorized_total_token_ceiling: 3600000
  additional_hamilton_launches:
    state: operational_gate_completed
    scope: [dynamic_d01/repeat_1, viv_u248/repeat_1]
  note: ceilings_include_input_and_output_tokens_and_are_separate_from_pysr_evaluations

execution_waves:
  - id: operational_gate
    tasks: [static_s01, dynamic_d01, viv_u248]
    repeats: [repeat_1]
    arm_runs: 9
    maximum_evaluations: 108000
    continuation_rule: >-
      Continue only if every arm produces structurally valid artifacts, evaluation ledgers
      reconcile, and no isolation or fairness contract fails. Scientific scores cannot be
      used to change the frozen protocol.
  - id: complete_pilot
    tasks: all_remaining_frozen_tasks
    repeats: all_remaining_paired_repeats
    continuation_rule: run_without_protocol_changes_after_operational_gate_passes

seed_plan:
  immutable_after_first_result: true
  repeats:
    - repeat_id: repeat_1
      ordinary_primary_seed: 1101
      episode_seeds: [1101, 1102, 1103]
    - repeat_id: repeat_2
      ordinary_primary_seed: 2201
      episode_seeds: [2201, 2202, 2203]
    - repeat_id: repeat_3
      ordinary_primary_seed: 3301
      episode_seeds: [3301, 3302, 3303]


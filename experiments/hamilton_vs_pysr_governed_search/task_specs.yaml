status: frozen
experiment_id: hamilton-vs-pysr-governed-search-pilot-v1

shared_search:
  engine: pysr
  binary_operators: ["+", "-", "*", "/"]
  unary_operators: ["sin", "cos", "exp"]
  niterations: 1000
  populations: 8
  population_size: 32
  tournament_selection_n: 12
  maxsize: 31
  parsimony: 0.001
  top_k: 10

shared_verification:
  candidate_ranking:
    enabled: true
    max_candidates: 10
    weights:
      validation_nrmse: 1.0
      trajectory_nrmse: 0.0
      complexity: 0.05
    failure_penalty: 100.0
  residual_diagnostics:
    enabled: true
    max_lag: 50
    feature_bins: 4
    phase_bins: 8
    high_frequency_fraction: 0.25

